<script>

const urlParams =
    new URLSearchParams(window.location.search);

const playerName =
    urlParams.get("name") ||
    "Lamine Yamal";

function getCountryLogo(country){

    const code =
        window.getCountryCode
        ? window.getCountryCode(country)
        : "default";

    return `logos/countries/${code}.png`;
}

function calculateAge(dateString){

    if(!dateString) return "";

    const [day, month, year] =
        dateString.split(".");

    const birthDate =
        new Date(year, month - 1, day);

    const today =
        new Date();

    let age =
        today.getFullYear() -
        birthDate.getFullYear();

    const monthDiff =
        today.getMonth() -
        birthDate.getMonth();

    if(
        monthDiff < 0 ||
        (
            monthDiff === 0 &&
            today.getDate() < birthDate.getDate()
        )
    ){
        age--;
    }

    return age;
}

function renderPlayer(player){

    const photo =
        window.getPlayerPhoto
            ? window.getPlayerPhoto(player.Name)
            : "default.webp";

    const age =
        calculateAge(player["Birth Date"]);

	document.title =
	    `${player.Name} | Barça Database`;

document.getElementById("playerProfile").innerHTML = `

    <div class="player-header-left">

        <img
            src="logos/players/${photo}"
            alt="${player.Name}"
            class="player-profile-photo"
            onerror="this.src='logos/players/default.webp'">

        <div class="player-header-info">

            <h2>

                ${player.Name}

                <img
                    src="${getCountryLogo(player.Nationality)}"
                    alt="${player.Nationality}"
                    class="player-flag-large"
                    onerror="this.src='logos/countries/default.png'">

            </h2>

            <div class="player-header-meta">

                <span>NO</span>

                <strong>#${player.Number}</strong>

                <span>AGE</span>

                <strong>${age}</strong>

                <span>${player.Position}</span>

            </div>

        </div>

    </div>

    <div class="player-header-right">

        <select
            id="playerSelect"
            class="player-select">

            ${allPlayers
                .sort((a,b)=>
                    Number(a.Number) -
                    Number(b.Number)
                )
                .map(p => `
                    <option
                        value="${p.Name}"
                        ${p.Name === player.Name ? "selected" : ""}>
                        #${p.Number} ${p.Name}
                    </option>
                `)
                .join("")}

        </select>

    </div>

`;
document
.getElementById("playerSelect")
?.addEventListener("change", e => {

    window.location.href =
        `players-stats.html?name=${encodeURIComponent(e.target.value)}`;

});
}

let allMatches = [];
let allPlayers = [];


Promise.all([
    fetch("data/playersCS.json").then(r => r.json()),
    fetch("data/data.json").then(r => r.json())
])
.then(([players, matches]) => {

    allMatches = matches;
	allPlayers = players;

    initPersonSearch();

    const player = players.find(
        p => p.Name === playerName
    );

    if(!player){

        document.getElementById("playerProfile")
            .innerHTML = "<p>Player not found.</p>";

        return;
    }

    renderPlayer(player);

})
.catch(console.error);

function initPersonSearch(){

	if(!allMatches.length){
	    return;
	}

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Team"]){

            searchItems.set(
                `opponent-${match["Opp. Team"]}`,
                {
                    name: match["Opp. Team"],
                    type: "Opponent"
                }
            );

        }

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        for(let i = 1; i <= 12; i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );

    const input =
        document.getElementById(
            "sidebarPersonSearch"
        );

    const results =
        document.getElementById(
            "sidebarSearchResults"
        );

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";

            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name
                    .toLowerCase()
                    .includes(value)
            )
            .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">

                ${filtered.map(item => {

                    let url = "player.html?name=" +
                        encodeURIComponent(item.name);

                    if(item.type === "Manager"){

                        url =
                        "manager.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    if(item.type === "Opponent"){

                        url =
                        "opponent.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    return `

                        <a
                            class="player-search-item"
                            href="${url}">

                            ${item.name}

                            <span class="search-type ${item.type.toLowerCase()}">
                                (${item.type})
                            </span>

                        </a>

                    `;

                }).join("")}

            </div>
        `;

    });

    input.addEventListener("blur", () => {

        setTimeout(() => {

            results.innerHTML = "";

        }, 200);

    });

}

</script>
