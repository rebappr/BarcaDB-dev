<style>

.content-layout.animate{
animation:pageRefresh .4s ease;
}

@keyframes pageRefresh{
from{
opacity:0;
transform:translateY(20px) scale(.98);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.left-panel{
    display:flex;
    flex-direction:column;
    flex:1.1;
    min-width:0;
    gap:8px;
}

.matches-view-switch{
display:flex;
gap:6px;
margin-bottom:10px;
}

.matches-view-switch button{
padding:8px 12px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:12px;
text-transform: uppercase;

background:var(--card-bg);
color:var(--text);

border:1px solid var(--card-border);
}

.matches-view-switch button.active{
background:#004D98;
color:white;
}

.mobile-sections{
display:none;
}

@media (prefers-color-scheme: dark){

    .filter-note{
        background:rgba(0,77,152,.15);
        border-color:#004D98;

    }

}

.matches-view-switch{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.filters{
    display:flex;
    flex-direction:column;
    gap:14px;

    padding:16px;

    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:24px;
}

.filter-section{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.filter-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
	margin-left:4px;
}

.filter-divider{
    height:1px;
    background:var(--meta-border);
    margin:2px 0;
}

.table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

.table-header{
    display:grid;

    grid-template-columns:
    36px
    1fr
    36px
    48px
    48px;

    gap:6px;
    padding:8px;

    background:var(--meta-bg);

    font-size:12px;
    font-weight:700;
    text-transform:uppercase;

    opacity:.7;
}

.table-line{
    display:grid;

    grid-template-columns:
    36px
    1fr
    36px
    48px
    48px;

    gap:6px;
    align-items:center;

    padding:8px;

    border-bottom:1px solid var(--meta-border);

    font-size:12px;
}

.table-header-full,
.table-line-full{
    display:grid;

    grid-template-columns:
    45px
    minmax(260px,1fr)
    60px
    60px
    60px
    60px
    110px
    80px
    70px;

    gap:6px;
    align-items:center;

    padding:8px;

    border-bottom:1px solid var(--meta-border);

    font-size:12px;
}

.table-header > div,
.table-line > div{
    justify-self:center;
}

.table-header > div:nth-child(1),
.table-line > div:nth-child(1){
    justify-self:start;
}

.table-header > div:nth-child(2),
.table-line > div:nth-child(2){
    justify-self:start;
}

.table-club{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    font-weight:600;
}

.table-club img{
    width:24px;
    height:24px;
    object-fit:contain;
    flex-shrink:0;
}

.table-club span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.table-played,
.table-goaldiff,
.table-points{
    text-align:center;
}

.barca-row{
    background:rgba(0,77,152,.08);
    border-left:4px solid #FDC52C;
}

.barca-row .table-club{
    font-weight:800;
    color:#A50044;
}

.position-circle{
    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:11px;

    background:var(--meta-bg);
    border:1px solid var(--meta-border);
}

.position-circle.leader{
    background:#00008b;
    color:white;
    border:none;
}

.position-circle.relegation{
    background:#ef4444;
    color:white;
    border:none;
}

.table-header-full > div,
.table-line-full > div{
    justify-self:center;
}

.table-header-full > div:nth-child(1),
.table-line-full > div:nth-child(1){
    justify-self:start;
}

.table-header-full > div:nth-child(2),
.table-line-full > div:nth-child(2){
    justify-self:start;
}

.position-circle.top8{
    background:#16a34a;
    color:white;
    border:none;
}

.standings-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
}

.view-links{
    display:flex;
    align-items:center;
    gap:12px;
    margin-left:auto;
}

.view-links a{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--muted);
    transition:.2s;
}

.view-links a:hover{
    color:#004D98;
}

.view-links a.active{
    color:#004D98;
}

.squad-section{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.section-header{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.squad-controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
}

.squad-search{
    width:280px;
    max-width:100%;
    height:42px;
    padding:0 14px;
    border:1px solid var(--border-color);
    border-radius:10px;
    background:var(--card-bg);
    color:var(--text-color);
}

.position-filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.position-btn{
    height:40px;
    padding:0 16px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:#fff;
    cursor:pointer;
    transition:.2s;
}

.position-btn:hover{
    background:#374151;
}

.position-btn.active{
    background:#004d98;
}

.squad-summary{
    font-size:.9rem;
    color:var(--secondary-text);
}

.squad-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
}

.player-card{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:14px;
    overflow:hidden;
    transition:.2s;
}

.player-card:hover{
    transform:translateY(-2px);
    border-color:#004d98;
}

.player-top{
    display:flex;
    gap:14px;
    padding:16px;
}

.player-photo{
    width:72px;
    height:72px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
}

.player-info{
    flex:1;
}

.player-name{
    font-size:1rem;
    font-weight:700;
    margin-bottom:6px;
}

.player-meta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.meta-badge{
    padding:4px 8px;
    border-radius:6px;
    font-size:.8rem;
    background:#f3f4f6;
    color:#111827;
}

.player-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--border-color);
}

.player-stat{
    text-align:center;
    padding:12px 8px;
}

.player-stat-value{
    font-weight:700;
    font-size:1rem;
}

.player-stat-label{
    font-size:.75rem;
    opacity:.7;
}

@media (max-width:820px){

    .squad-controls{
        flex-direction:column;
        align-items:stretch;
    }

    .squad-search{
        width:100%;
    }

    .position-filters{
        overflow-x:auto;
        flex-wrap:nowrap;
    }

    .squad-grid{
        grid-template-columns:1fr;
    }
}

</style>

                id="playerSearch"

            >

                <button class="position-btn" data-position="GK">GK</button>

<script>

let currentPosition = "all";
let currentSearch = "";

function renderSquad(players){

    const filtered = players.filter(player => {

        const searchMatch =
            player.name.toLowerCase()
            .includes(currentSearch.toLowerCase());

        const positionMatch =
            currentPosition === "all" ||
            player.position === currentPosition;

        return searchMatch && positionMatch;
    });

    document.getElementById("visiblePlayers").textContent =
        filtered.length;

document.getElementById("squadGrid").innerHTML =
    filtered.map(player => {

        const playerPhoto =
            player.photo || "logos/players/default.png";

        return `
            <article class="player-card">

                <div class="player-top">

                    <img
                        src="${playerPhoto}"
                        alt="${player.name}"
                        class="player-photo"
                        loading="lazy"
                        onerror="this.src='logos/players/default.png'"
                    >

                    <div class="player-info">

                        <div class="player-name">
                            ${player.name}
                        </div>

                        <div class="player-meta">
                            <span class="meta-badge">
                                #${player.number || "-"}
                            </span>

                            <span class="meta-badge">
                                ${player.position || "-"}
                            </span>

                            <span class="meta-badge">
                                ${player.nationality || "-"}
                            </span>
                        </div>

                    </div>

                </div>

                <div class="player-stats">

                    <div class="player-stat">
                        <div class="player-stat-value">
                            ${player.appearances || 0}
                        </div>
                        <div class="player-stat-label">
                            Apps
                        </div>
                    </div>

                    <div class="player-stat">
                        <div class="player-stat-value">
                            ${player.goals || 0}
                        </div>
                        <div class="player-stat-label">
                            Goals
                        </div>
                    </div>

                    <div class="player-stat">
                        <div class="player-stat-value">
                            ${player.assists || 0}
                        </div>
                        <div class="player-stat-label">
                            Assists
                        </div>
                    </div>

                </div>

            </article>
        `;
    }).join("");
}

document.getElementById("playerSearch")
.addEventListener("input", e => {

    currentSearch = e.target.value;

    renderSquad(squadData);

});

document.querySelectorAll(".position-btn")
.forEach(btn => {

    btn.addEventListener("click", () => {

        document
            .querySelectorAll(".position-btn")
            .forEach(b => b.classList.remove("active"));

        btn.classList.add("active");

        currentPosition = btn.dataset.position;

        renderSquad(squadData);
    });
});

let squadData = [];

fetch("players.json")
    .then(res => res.json())
    .then(data => {

        squadData = data;

        renderSquad(squadData);

    })
    .catch(err => console.error(err));

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Team"]){

            searchItems.set(
                `opponent-${match["Opp. Team"]}`,
                {
                    name: match["Opp. Team"],
                    type: "Opponent"
                }
            );

        }

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        for(let i = 1; i <= 12; i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );

    const input =
        document.getElementById(
            "sidebarPersonSearch"
        );

    const results =
        document.getElementById(
            "sidebarSearchResults"
        );

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";

            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name
                    .toLowerCase()
                    .includes(value)
            )
            .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">

                ${filtered.map(item => {

                    let url = "player.html?name=" +
                        encodeURIComponent(item.name);

                    if(item.type === "Manager"){

                        url =
                        "manager.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    if(item.type === "Opponent"){

                        url =
                        "opponent.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    return `

                        <a
                            class="player-search-item"
                            href="${url}">

                            ${item.name}

                            <span class="search-type ${item.type.toLowerCase()}">
                                (${item.type})
                            </span>

                        </a>

                    `;

                }).join("")}

            </div>
        `;

    });

    input.addEventListener("blur", () => {

        setTimeout(() => {

            results.innerHTML = "";

        }, 200);

    });

}

</script>
