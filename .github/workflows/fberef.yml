name: FBref Import

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node scripts/import-fbref.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/fbref

          git diff --staged --quiet || \
          git commit -m "Update FBref data"

          git push
